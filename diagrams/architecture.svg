<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Target architecture: OpenTelemetry-instrumented shop services send logs, metrics and traces through an EDOT Collector to Elastic Observability, which alerts to Slack and feeds the AI Agent">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#343741"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1a1c21; }
      .sub { font-size: 15px; fill: #516381; }
      .zone { fill: #f6f9fc; stroke: #cad3e2; stroke-width: 1.5; rx: 14; }
      .zoneTitle { font-size: 15px; font-weight: 700; fill: #516381; letter-spacing: .5px; }
      .box { fill: #ffffff; stroke: #343741; stroke-width: 1.5; rx: 10; }
      .elastic { fill: #e6f1fa; stroke: #0b64dd; stroke-width: 2; rx: 12; }
      .feat { fill: #ffffff; stroke: #0b64dd; stroke-width: 1.3; rx: 8; }
      .h { font-size: 16px; font-weight: 700; fill: #1a1c21; }
      .t { font-size: 13px; fill: #343741; }
      .edge { stroke: #343741; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edgeLabel { font-size: 12px; fill: #343741; font-weight: 600; }
      .pain { fill: #fff3f0; stroke: #c61e25; stroke-width: 1.3; rx: 8; }
      .painT { font-size: 12.5px; fill: #8a0f14; }
      .fixT { font-size: 12.5px; fill: #09724d; font-weight: 600; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="40" y="48" class="title">Gipfelkorb AG: one platform for logs, metrics and traces</text>
  <text x="40" y="74" class="sub">Target architecture. Open standards on the way in (OpenTelemetry), one data store, native alerting and AI on top.</text>

  <!-- Zone 1: customer Kubernetes -->
  <rect x="30" y="100" width="360" height="420" class="zone"/>
  <text x="50" y="128" class="zoneTitle">GIPFELKORB KUBERNETES (web shop)</text>

  <rect x="50" y="146" width="320" height="170" class="box"/>
  <text x="66" y="172" class="h">Shop microservices</text>
  <text x="66" y="194" class="t">frontend, checkout, cart, payment,</text>
  <text x="66" y="212" class="t">product-catalog, shipping, ...</text>
  <text x="66" y="240" class="t">Instrumented with OpenTelemetry SDKs</text>
  <text x="66" y="258" class="t">and EDOT SDKs (Java, .NET, Node.js, PHP)</text>
  <text x="66" y="290" class="t" font-style="italic">Demo: OpenTelemetry Astronomy Shop</text>

  <rect x="50" y="372" width="320" height="120" class="box"/>
  <text x="66" y="398" class="h">EDOT Collector (Elastic Agent)</text>
  <text x="66" y="420" class="t">Receives OTLP from the services</text>
  <text x="66" y="438" class="t">Adds host and Kubernetes metrics</text>
  <text x="66" y="456" class="t">Batches and exports OTLP over HTTPS</text>

  <path d="M210 316 L210 370" class="edge"/>
  <text x="220" y="348" class="edgeLabel">OTLP: logs, metrics, traces</text>

  <!-- Zone 2: Elastic -->
  <rect x="470" y="100" width="500" height="420" class="elastic"/>
  <text x="490" y="128" class="zoneTitle" fill="#0b64dd">ELASTIC CLOUD: ELASTIC OBSERVABILITY</text>

  <rect x="490" y="146" width="460" height="64" class="feat"/>
  <text x="506" y="172" class="h">Managed OTLP endpoint</text>
  <text x="506" y="194" class="t">Stores telemetry in OpenTelemetry format, no translation</text>

  <rect x="490" y="224" width="460" height="64" class="feat"/>
  <text x="506" y="250" class="h">Elasticsearch: one store for all three signals</text>
  <text x="506" y="272" class="t">Logs, metrics and traces linked by trace ID. Queried with ES|QL.</text>

  <rect x="490" y="302" width="222" height="92" class="feat"/>
  <text x="506" y="328" class="h">Applications (APM)</text>
  <text x="506" y="350" class="t">Service map, traces,</text>
  <text x="506" y="368" class="t">correlated logs</text>

  <rect x="728" y="302" width="222" height="92" class="feat"/>
  <text x="744" y="328" class="h">SLOs and alerting</text>
  <text x="744" y="350" class="t">Threshold and burn rate</text>
  <text x="744" y="368" class="t">rules, native connectors</text>

  <rect x="490" y="408" width="222" height="92" class="feat"/>
  <text x="506" y="434" class="h">AI Agent</text>
  <text x="506" y="456" class="t">"Investigate this alert":</text>
  <text x="506" y="474" class="t">root cause from real data</text>

  <rect x="728" y="408" width="222" height="92" class="feat"/>
  <text x="744" y="434" class="h">Dashboards</text>
  <text x="744" y="456" class="t">Business impact: checkouts,</text>
  <text x="744" y="474" class="t">revenue at risk, SLO status</text>

  <path d="M370 432 C 440 432, 410 178, 488 178" class="edge"/>
  <text x="432" y="300" class="edgeLabel" transform="rotate(-90 432 300)">OTLP / HTTPS + API key</text>

  <!-- Zone 3: people -->
  <rect x="1050" y="100" width="200" height="420" class="zone"/>
  <text x="1068" y="128" class="zoneTitle">PEOPLE</text>

  <rect x="1066" y="146" width="168" height="92" class="box"/>
  <text x="1080" y="172" class="h">Slack #shop-alerts</text>
  <text x="1080" y="194" class="t">On-call engineer gets</text>
  <text x="1080" y="212" class="t">the alert with a link</text>

  <rect x="1066" y="302" width="168" height="92" class="box"/>
  <text x="1080" y="328" class="h">SRE team</text>
  <text x="1080" y="350" class="t">Investigates in one UI,</text>
  <text x="1080" y="368" class="t">with the AI Agent</text>

  <rect x="1066" y="408" width="168" height="92" class="box"/>
  <text x="1080" y="434" class="h">Business owners</text>
  <text x="1080" y="456" class="t">See impact in CHF,</text>
  <text x="1080" y="474" class="t">not in stack traces</text>

  <path d="M950 330 C 1010 330, 1000 192, 1064 192" class="edge"/>
  <text x="978" y="290" class="edgeLabel">Slack</text>
  <text x="978" y="304" class="edgeLabel" style="display:none"> </text>
  <path d="M1064 348 L952 348" class="edge"/>
  <path d="M1064 454 L952 454" class="edge"/>

  <!-- numbered markers -->
  <g>
    <circle cx="950" cy="146" r="13" fill="#0b64dd"/><text x="950" y="151" text-anchor="middle" class="num">1</text>
    <circle cx="950" cy="302" r="13" fill="#0b64dd"/><text x="950" y="307" text-anchor="middle" class="num">2</text>
    <circle cx="712" cy="408" r="13" fill="#0b64dd"/><text x="712" y="413" text-anchor="middle" class="num">3</text>
    <circle cx="950" cy="408" r="13" fill="#0b64dd"/><text x="950" y="413" text-anchor="middle" class="num">4</text>
  </g>

  <!-- pain to fix callouts -->
  <g>
    <rect x="30" y="544" width="296" height="150" class="pain"/>
    <circle cx="54" cy="568" r="13" fill="#0b64dd"/><text x="54" y="573" text-anchor="middle" class="num">1</text>
    <text x="76" y="573" class="h">Tool sprawl</text>
    <text x="46" y="602" class="painT">❌ Three tools, three logins, no shared</text>
    <text x="46" y="620" class="painT">    context between metrics, logs, traces</text>
    <text x="46" y="650" class="fixT">✅ One OTLP endpoint, one store,</text>
    <text x="46" y="668" class="fixT">    signals linked by trace ID</text>

    <rect x="338" y="544" width="296" height="150" class="pain"/>
    <circle cx="362" cy="568" r="13" fill="#0b64dd"/><text x="362" y="573" text-anchor="middle" class="num">2</text>
    <text x="384" y="573" class="h">Customers report first</text>
    <text x="354" y="602" class="painT">❌ No alert on what the customer feels;</text>
    <text x="354" y="620" class="painT">    support tickets are the monitoring</text>
    <text x="354" y="650" class="fixT">✅ SLOs and latency alerts on the shop,</text>
    <text x="354" y="668" class="fixT">    sent to Slack in about a minute</text>

    <rect x="646" y="544" width="296" height="150" class="pain"/>
    <circle cx="670" cy="568" r="13" fill="#0b64dd"/><text x="670" y="573" text-anchor="middle" class="num">3</text>
    <text x="692" y="573" class="h">Long resolution times</text>
    <text x="662" y="602" class="painT">❌ War rooms: each team checks its own</text>
    <text x="662" y="620" class="painT">    tool and exports data by hand</text>
    <text x="662" y="650" class="fixT">✅ AI Agent finds the root cause across</text>
    <text x="662" y="668" class="fixT">    all signals; engineers verify in one UI</text>

    <rect x="954" y="544" width="296" height="150" class="pain"/>
    <circle cx="978" cy="568" r="13" fill="#0b64dd"/><text x="978" y="573" text-anchor="middle" class="num">4</text>
    <text x="1000" y="573" class="h">No view of business impact</text>
    <text x="970" y="602" class="painT">❌ The business learns the cost of an</text>
    <text x="970" y="620" class="painT">    incident days later, if at all</text>
    <text x="970" y="650" class="fixT">✅ Live dashboard: checkouts and</text>
    <text x="970" y="668" class="fixT">    estimated revenue at risk per minute</text>
  </g>
</svg>
